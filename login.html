<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - YWIES 论坛</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-box">
        <a href="index.html" class="auth-logo">YWIES 论坛</a>
        <h1>登录</h1>

        <div class="auth-form">
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="loginEmail" placeholder="you@ywies.com">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="密码">
            </div>
            <button class="btn-primary" id="loginBtn" onclick="doLogin()">登录</button>
            <p class="auth-switch">还没有账号？<a href="register.html">注册一个</a></p>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        async function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!email || !password) { alert('请填完整'); return; }
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            try {
                const res = await Auth.post('/api/login', { email: email, password: password });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '登录失败');
                Auth.save(data.token, data.user);
                window.location.href = 'index.html';
            } catch (e) {
                alert(e.message);
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
