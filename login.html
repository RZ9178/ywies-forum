<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - YWIES 论坛</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@5.0.0/lib/Normal/MiSansVF.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css?v=20261124a">
</head>
<body class="auth-page" data-page-title="loginPageTitle">
    <div class="auth-box">
        <a href="index.html" class="auth-logo" data-i18n="appName">YWIES 论坛</a>
        <button type="button" class="auth-lang js-lang-toggle" title="切换语言">EN</button>
        <h1 data-i18n="authLoginTitle">登录</h1>

        <div class="auth-form">
            <div class="form-group">
                <label data-i18n="nickname">昵称</label>
                <input type="text" id="loginName" placeholder="你的昵称" data-i18n-placeholder="nicknamePlaceholder">
            </div>
            <div class="form-group">
                <label data-i18n="password">密码</label>
                <input type="password" id="loginPassword" placeholder="密码" data-i18n-placeholder="passwordPlaceholder">
            </div>
            <button class="btn-primary" id="loginBtn" onclick="doLogin()" data-i18n="loginButton">登录</button>
            <p class="auth-switch"><span data-i18n="noAccount">还没有账号？</span> <a href="register.html" data-i18n="signUpLink">注册一个</a></p>
        </div>
    </div>

    <script src="js/auth.js?v=20261124a"></script>
    <script src="js/i18n.js?v=20261124a"></script>
    <script>
        async function doLogin() {
            const username = document.getElementById('loginName').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!username || !password) { alert(I18n.t('fillBoth')); return; }
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            try {
                const res = await Auth.post('/api/login', { username: username, password: password });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || I18n.t('loginFailed'));
                Auth.save(data.token, data.user);
                window.location.href = data.user.is_admin ? 'admin.html' : 'index.html';
            } catch (e) {
                alert(e.message);
                btn.disabled = false;
            }
        }
        ['loginName','loginPassword'].forEach(function (id) {
            document.getElementById(id).addEventListener('keydown', function (e) {
                if (e.key === 'Enter') doLogin();
            });
        });
    </script>
</body>
</html>
