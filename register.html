<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - YWIES 论坛</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-box">
        <a href="index.html" class="auth-logo">YWIES 论坛</a>
        <h1>注册新账号</h1>

        <div class="auth-form">
            <div class="form-group">
                <label>昵称</label>
                <input type="text" id="regName" placeholder="给自己起个昵称">
            </div>

            <div class="form-group">
                <label>密码（至少 6 位）</label>
                <input type="password" id="regPassword" placeholder="设置密码">
            </div>

            <button class="btn-primary" id="regBtn" onclick="doRegister()">注册</button>

            <p class="auth-switch">已有账号？<a href="login.html">直接登录</a></p>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        async function doRegister() {
            const username = document.getElementById('regName').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            if (!username || !password) { alert('请填昵称和密码'); return; }
            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            try {
                const res = await Auth.post('/api/register', {
                    username: username, password: password
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '注册失败');
                Auth.save(data.token, data.user);
                window.location.href = 'index.html';
            } catch (e) {
                alert(e.message);
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
