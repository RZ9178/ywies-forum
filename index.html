<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YWIES 论坛</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 顶部导航 -->
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <img src="school-badge.png" class="brand-logo" alt="校徽">
                <span class="brand-name">YWIES 论坛</span>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索帖子...">
            </div>

            <div class="topbar-actions">
                <button class="bell-btn" id="bellBtn" title="通知">
                    🔔
                    <span class="bell-dot" id="bellDot" hidden></span>
                </button>
                <a href="post.html" class="btn-post">发帖</a>
            </div>
        </div>
    </header>

    <!-- Tab 导航 -->
    <nav class="tab-bar">
        <div class="tab-inner">
            <button class="tab active" data-tab="latest">最新</button>
            <button class="tab" data-tab="hot">热门</button>
            <button class="tab" data-tab="unread">未看</button>
            <button class="tab" data-tab="followed">关注</button>
            <button class="tab" data-tab="bookmarked">收藏</button>
            <button class="tab" data-tab="all">全部</button>
        </div>
    </nav>

    <!-- 标签筛选 -->
    <div class="tag-bar" id="tagBar">
        <button class="tag-pill active" data-tag="">全部</button>
        <button class="tag-pill" data-tag="食堂">食堂</button>
        <button class="tag-pill" data-tag="社团招新">社团招新</button>
        <button class="tag-pill" data-tag="物品交换">物品交换</button>
        <button class="tag-pill" data-tag="求助">求助</button>
        <button class="tag-pill" data-tag="闲聊">闲聊</button>
    </div>

    <!-- 帖子列表 -->
    <main class="list-wrap">
        <div class="list-header">
            <span class="col-main">标题</span>
            <span class="col-author">作者</span>
            <span class="col-replies">回复</span>
            <span class="col-views">浏览</span>
            <span class="col-time">最后回复</span>
        </div>
        <div id="postList"></div>
        <div class="empty-state" id="emptyState" hidden>
            这里还没有帖子，点右上角「发帖」发第一条吧
        </div>
    </main>

    <!-- 通知中心弹窗 -->
    <div class="modal-mask" id="notifModal" hidden>
        <div class="modal">
            <div class="modal-head">
                <span>通知中心</span>
                <button class="modal-close" id="notifClose">×</button>
            </div>
            <div class="modal-body" id="notifList"></div>
        </div>
    </div>

    <!-- 帖子详情弹窗 -->
    <div class="detail-mask" id="detailModal" hidden>
        <div class="detail-dialog">
            <!-- 右上角红色关闭按钮 -->
            <button class="detail-close" id="detailClose" title="关闭">✕</button>

            <div class="detail-grid">
                <!-- 左：帖子图片 -->
                <div class="detail-img-col">
                    <div class="detail-img" id="detailImg"></div>
                </div>

                <!-- 中：作者 / 点赞 / 标题 / 正文 / 时间 -->
                <div class="detail-main-col">
                    <div class="detail-author">
                        <div class="detail-avatar" id="detailAvatar"></div>
                        <div class="detail-author-info">
                            <div class="detail-author-name" id="detailAuthorName"></div>
                            <div class="detail-like" id="detailLikes">♥ 0</div>
                        </div>
                    </div>
                    <h2 class="detail-title" id="detailTitle"></h2>
                    <div class="detail-content" id="detailContent"></div>
                    <div class="detail-time" id="detailTime"></div>
                </div>

                <!-- 右：评论区 -->
                <div class="detail-comments-col">
                    <div class="comments-head">
                        <span>评论 <span id="commentCount">0</span></span>
                        <div class="comments-sort">
                            <button class="sort-btn active" data-sort="earliest">最早</button>
                            <button class="sort-btn" data-sort="latest">最新</button>
                        </div>
                    </div>
                    <div class="comments-list" id="commentsList"></div>
                </div>
            </div>

            <!-- 底部操作栏 -->
            <div class="detail-footer">
                <div class="footer-input">
                    <input type="text" id="commentInput" placeholder="说点什么...">
                </div>
                <button class="footer-btn" id="footerLike" title="点赞">👍 <span id="footerLikeCount">0</span></button>
                <button class="footer-btn" id="footerCoin" title="硬币">🪙 <span id="footerCoinCount">0</span></button>
                <button class="footer-btn" id="footerStar" title="收藏">☆ <span id="footerStarCount">0</span></button>
            </div>
        </div>
    </div>

    <!-- AI 聊天窗口 - 耀耀 -->
    <button class="chat-float-btn" id="chatToggleBtn" title="和耀耀聊天">
        <img src="mascot.png" alt="耀耀">
    </button>
    <div class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="chat-avatar"><img src="mascot.png" alt="耀耀"></div>
                <span>耀耀</span>
            </div>
            <button class="chat-close-btn" onclick="closeChat()">×</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg ai"><div class="bubble">你好！我是耀耀，有什么可以帮你的？</div></div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="输入消息...">
            <button id="chatSendBtn">发送</button>
        </div>
    </div>

    <script src="js/language.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
