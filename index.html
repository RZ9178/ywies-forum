<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YWIES 论坛</title>
    <link rel="stylesheet" href="style.css?v=20261117">
</head>
<body>

    <!-- 图标集（2.4）：统一线性图标，currentColor 跟随主题 -->
    <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true">
        <symbol id="i-like" viewBox="0 0 24 24"><path d="M12 20.2s-7.2-4.6-7.2-9.4A4.1 4.1 0 0 1 12 8.1a4.1 4.1 0 0 1 7.2 2.7c0 4.8-7.2 9.4-7.2 9.4Z"/></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6"/></symbol>
        <symbol id="i-reply" viewBox="0 0 24 24"><path d="M20 11.5a6.5 6.5 0 0 1-6.5 6.5H9l-4 3v-3.7A6.5 6.5 0 0 1 10.5 5h3A6.5 6.5 0 0 1 20 11.5Z"/></symbol>
        <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.1 5.9-.9L12 3.5Z"/></symbol>
        <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9.5 9.5h5M9.5 14.5h5M12 8v8"/></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m5 17 4.5-4.5 3 3L16 11.5l3 3"/></symbol>
    </svg>

    <!-- 顶部导航 -->
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <img src="school-badge.png" class="brand-logo" alt="校徽">
                <span class="brand-name">YWIES 论坛</span>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索帖子...">
            </div>

            <div class="topbar-actions" id="topbarActions">
                <button class="bell-btn" id="bellBtn" title="通知">
                    🔔
                    <span class="bell-dot" id="bellDot" hidden></span>
                </button>
                <button class="btn-post" id="openPostBtn">发帖</button>
                <!-- 未登录时显示登录/注册 -->
                <a href="login.html" class="btn" id="loginBtn">登录</a>
                <a href="register.html" class="btn" id="registerBtn">注册</a>
                <!-- 登录后显示用户名和后台入口 -->
                <span id="userArea" hidden>
                    <span class="user-name" id="userName"></span>
                    <a href="admin.html" class="btn" id="adminBtn" hidden>后台</a>
                    <button class="btn" id="logoutBtn">退出</button>
                </span>
            </div>
        </div>
    </header>

    <!-- Tab 导航 -->
    <nav class="tab-bar">
        <div class="tab-inner">
            <button class="tab active" data-tab="latest">最新</button>
            <button class="tab" data-tab="hot">热门</button>
            <button class="tab" data-tab="unread">未看</button>
            <button class="tab" data-tab="followed">关注</button>
            <button class="tab" data-tab="bookmarked">收藏</button>
            <button class="tab" data-tab="all">全部</button>
        </div>
    </nav>

    <!-- 标签筛选（JS 动态加载） -->
    <div class="tag-bar" id="tagBar">
        <button class="tag-pill active" data-tag="">全部</button>
    </div>

    <!-- 帖子列表 -->
    <main class="list-wrap">
        <div class="list-header">
            <span class="col-main">标题</span>
            <span class="col-author">作者</span>
            <span class="col-replies">回复</span>
            <span class="col-views">浏览</span>
            <span class="col-time">最后回复</span>
        </div>
        <div id="postList" class="post-grid"></div>
        <div class="empty-state" id="emptyState" hidden>
            这里还没有帖子，点右上角「发帖」发第一条吧
        </div>
    </main>

    <!-- 通知中心弹窗 -->
    <div class="modal-mask" id="notifModal" hidden>
        <div class="modal">
            <div class="modal-head">
                <span>通知中心</span>
                <button class="modal-close" id="notifClose">×</button>
            </div>
            <div class="modal-body" id="notifList"></div>
        </div>
    </div>

    <!-- 发帖弹窗 -->
    <div class="modal-mask" id="postModal" hidden>
        <div class="post-dialog">
            <div class="modal-head">
                <span>发布新帖子</span>
                <button class="modal-close" id="postClose">×</button>
            </div>
            <div class="post-body">
                <div class="post-form-group">
                    <label>发布身份</label>
                    <input type="text" id="postAuthor" readonly title="以当前登录账号发布">
                </div>
                <div class="post-form-group">
                    <label>标题</label>
                    <input type="text" id="postTitle" placeholder="给帖子起个标题...">
                </div>
                <div class="post-form-group">
                    <label>正文</label>
                    <textarea id="postContent" rows="5" placeholder="想说点什么..."></textarea>
                </div>
                <div class="post-form-group">
                    <label id="imageLabel">图片（可选，最多 9 张，单张 ≤10MB）</label>
                    <div class="upload-area" id="uploadArea">
                        <input type="file" id="postImage" accept="image/*" multiple hidden>
                        <div class="upload-placeholder" id="uploadPlaceholder">点击或拖拽上传图片（自动压缩）</div>
                    </div>
                    <div class="upload-hint" id="uploadHint"></div>
                    <div class="image-preview-list" id="imagePreviewList"></div>
                </div>
                <div class="post-form-group">
                    <label>标签</label>
                    <div class="tag-picker" id="tagPicker"></div>
                    <div class="tag-new-row">
                        <input type="text" id="newTagInput" placeholder="输入新标签，回车添加">
                    </div>
                </div>
                <button class="btn-post btn-submit" id="submitPostBtn">发布帖子</button>
            </div>
        </div>
    </div>

    <!-- 帖子详情弹窗 -->
    <div class="detail-mask" id="detailModal" hidden>
        <div class="detail-dialog">
            <button class="detail-close" id="detailClose" title="关闭">✕</button>

            <div class="detail-grid">
                <div class="detail-img-col">
                    <div class="detail-img" id="detailImg"></div>
                    <div class="detail-thumbs" id="detailThumbs" hidden></div>
                </div>

                <div class="detail-main-col">
                    <div class="detail-author">
                        <div class="detail-avatar" id="detailAvatar"></div>
                        <div class="detail-author-info">
                            <div class="detail-author-name" id="detailAuthorName"></div>
                            <div class="detail-like" id="detailLikes">♥ 0</div>
                        </div>
                    </div>
                    <h2 class="detail-title" id="detailTitle"></h2>
                    <div class="detail-content" id="detailContent"></div>
                    <div class="detail-time" id="detailTime"></div>
                </div>

                <div class="detail-comments-col">
                    <div class="comments-head">
                        <span>评论 <span id="commentCount">0</span></span>
                        <div class="comments-sort">
                            <button class="sort-btn active" data-sort="earliest">最早</button>
                            <button class="sort-btn" data-sort="latest">最新</button>
                        </div>
                    </div>
                    <div class="comments-list" id="commentsList"></div>
                </div>
            </div>

            <div class="detail-footer">
                <div class="footer-input">
                    <input type="text" id="commentAuthor" readonly title="以当前登录账号评论" style="width:90px;margin-right:6px;">
                    <input type="text" id="commentInput" placeholder="说点什么...">
                </div>
                <button class="footer-btn" id="footerLike" title="点赞"><svg class="icon icon-heart" aria-hidden="true"><use href="#i-like"></use></svg> <span id="footerLikeCount">0</span></button>
                <button class="footer-btn" id="footerCoin" title="硬币"><svg class="icon icon-coin" aria-hidden="true"><use href="#i-coin"></use></svg> <span id="footerCoinCount">0</span></button>
                <button class="footer-btn" id="footerStar" title="收藏"><svg class="icon icon-star" aria-hidden="true"><use href="#i-star"></use></svg> <span id="footerStarCount">0</span></button>
            </div>
        </div>
    </div>

    <!-- 图片查看器（点击详情图放大 / 轮播 / 下载） -->
    <div class="detail-mask image-viewer" id="imageViewer" hidden>
        <button type="button" class="detail-close" id="imageViewerClose" title="关闭">✕</button>
        <button type="button" class="image-viewer-nav prev" id="imageViewerPrev" title="上一张">‹</button>
        <img class="image-viewer-img" id="imageViewerImg" alt="帖子图片">
        <button type="button" class="image-viewer-nav next" id="imageViewerNext" title="下一张">›</button>
        <div class="image-viewer-count" id="imageViewerCount"></div>
        <a class="image-viewer-download" id="imageViewerDownload">下载图片</a>
    </div>

    <!-- AI 聊天窗口 - 耀耀 -->
    <button class="chat-float-btn" id="chatToggleBtn" title="和耀耀聊天">
        <img src="mascot.png" alt="耀耀">
    </button>
    <div class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="chat-avatar"><img src="mascot.png" alt="耀耀"></div>
                <span>耀耀</span>
            </div>
            <button class="chat-close-btn" onclick="closeChat()">×</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg ai"><div class="bubble">你好！我是耀耀，有什么可以帮你的？</div></div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="输入消息...">
            <button id="chatSendBtn">发送</button>
        </div>
    </div>

    <script src="js/auth.js?v=20261117"></script>
    <script src="js/language.js?v=20261117"></script>
    <script src="js/chat.js?v=20261117"></script>
    <script src="js/script.js?v=20261117"></script>
</body>
</html>
