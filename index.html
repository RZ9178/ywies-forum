<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YWIES 论坛</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@5.0.0/lib/Normal/MiSansVF.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css?v=20261124d">
</head>
<body>

    <!-- 图标集（2.4）：统一线性图标，currentColor 跟随主题 -->
    <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true">
        <symbol id="i-like" viewBox="0 0 24 24"><path d="M12 20.2s-7.2-4.6-7.2-9.4A4.1 4.1 0 0 1 12 8.1a4.1 4.1 0 0 1 7.2 2.7c0 4.8-7.2 9.4-7.2 9.4Z"/></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6"/></symbol>
        <symbol id="i-reply" viewBox="0 0 24 24"><path d="M20 11.5a6.5 6.5 0 0 1-6.5 6.5H9l-4 3v-3.7A6.5 6.5 0 0 1 10.5 5h3A6.5 6.5 0 0 1 20 11.5Z"/></symbol>
        <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.1 5.9-.9L12 3.5Z"/></symbol>
        <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9.5 9.5h5M9.5 14.5h5M12 8v8"/></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m5 17 4.5-4.5 3 3L16 11.5l3 3"/></symbol>
        <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 7 8 6 8-6"/></symbol>
        <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></symbol>
        <symbol id="i-bubble" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H8l-5 3v-5.2A8.5 8.5 0 1 1 21 11.5Z"/></symbol>
        <symbol id="i-compose" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="5"/><path d="M12 9v6M9 12h6"/></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.3 3.3-5 7-5s6.2 1.7 7 5"/></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
        <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></symbol>
        <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></symbol>
        <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5c3-2 6-1 8 1 2-2 5-3 8-1v14c-3-2-6-1-8 1-2-2-5-3-8-1z"/><path d="M12 6v14"/></symbol>
        <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
        <symbol id="i-poll" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-6"/></symbol>
        <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M13 4l-2 16"/></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/></symbol>
        <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></symbol>
    </svg>

    <!-- 顶部导航 -->
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <img src="school-badge.png" class="brand-logo" alt="校徽">
                <span class="brand-name" data-i18n="appName">YWIES 论坛</span>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索帖子..." data-i18n-placeholder="searchPlaceholder">
            </div>

            <div class="topbar-actions" id="topbarActions">
                <span class="coin-balance" id="coinBalance" hidden title="硬币余额" data-i18n-title="coinBalanceTitle">
                    <svg class="icon icon-coin" aria-hidden="true"><use href="#i-coin"></use></svg>
                    <span id="coinBalanceNum">0</span>
                </span>
                <button class="header-lang" id="langBtn" type="button" title="切换语言" aria-label="切换语言" data-i18n-title="languageToggle" data-i18n-aria="languageToggle">
                    <span class="lang-zh">中</span><span class="lang-sep">/</span><span class="lang-en">EN</span>
                </button>
                <button class="header-icon-btn" id="bellBtn" title="通知" aria-label="通知" data-i18n-title="notificationsTitle" data-i18n-aria="notificationsTitle">
                    <svg class="icon" aria-hidden="true"><use href="#i-bell"></use></svg>
                    <span class="bell-dot" id="bellDot" hidden></span>
                </button>
                <button class="header-icon-btn" id="msgBtn" title="消息" aria-label="消息" data-i18n-title="messagesTitle" data-i18n-aria="messagesTitle">
                    <svg class="icon" aria-hidden="true"><use href="#i-bubble"></use></svg>
                    <span class="bell-dot" id="msgDot" hidden></span>
                </button>
                <button class="header-icon-btn" id="openPostBtn" title="发布" aria-label="发布" data-i18n-title="newPost" data-i18n-aria="newPost">
                    <svg class="icon" aria-hidden="true"><use href="#i-compose"></use></svg>
                </button>
                <button class="header-avatar" id="meBtn" type="button" title="我的" aria-label="我的" data-i18n-title="myProfile" data-i18n-aria="myProfile">
                    <svg class="icon" aria-hidden="true"><use href="#i-user"></use></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Tab 导航 -->
    <nav class="tab-bar">
        <div class="tab-inner">
            <button class="tab active" data-tab="latest" data-i18n="tabLatest">最新</button>
            <button class="tab" data-tab="hot" data-i18n="tabHot">热门</button>
            <button class="tab" data-tab="unread" data-i18n="tabUnread">未看</button>
            <button class="tab" data-tab="followed" data-i18n="tabFollowed">关注</button>
        </div>
    </nav>

    <!-- 板块筛选 -->
    <nav class="board-bar" id="boardBar" aria-label="板块">
        <div class="board-inner">
            <button type="button" class="board-chip active" data-board="all" data-i18n="boardAll">全部</button>
            <button type="button" class="board-chip" data-board="general" data-i18n="boardGeneral">灌水</button>
            <button type="button" class="board-chip" data-board="study" data-i18n="boardStudy">学习</button>
            <button type="button" class="board-chip" data-board="music" data-i18n="boardMusic">音乐</button>
            <button type="button" class="board-chip" data-board="poll" data-i18n="boardPoll">投票</button>
            <button type="button" class="board-chip" data-board="share" data-i18n="boardShare">分享</button>
        </div>
    </nav>

    <!-- 帖子列表 -->
    <main class="list-wrap">
        <div class="list-header">
            <span class="col-main" data-i18n="listTitle">标题</span>
            <span class="col-author" data-i18n="listAuthor">作者</span>
            <span class="col-replies" data-i18n="listReplies">回复</span>
            <span class="col-views" data-i18n="listViews">浏览</span>
            <span class="col-time" data-i18n="listTime">最后回复</span>
        </div>
        <div id="postList" class="post-grid"></div>
        <div class="empty-state" id="emptyState" hidden data-i18n="emptyPosts">
            这里还没有帖子，点右上角「发帖」发第一条吧
        </div>
    </main>

    <!-- 通知中心弹窗 -->
    <div class="modal-mask" id="notifModal" hidden>
        <div class="modal">
            <div class="modal-head">
                <span data-i18n="notificationsCenter">通知中心</span>
                <button class="modal-close" id="notifClose">×</button>
            </div>
            <div class="modal-body" id="notifList"></div>
        </div>
    </div>

    <!-- 用户主页（整页） -->
    <div class="profile-page" id="profilePage" hidden>
        <div class="profile-page-inner">
            <button type="button" class="profile-back" id="profileBack" title="返回" aria-label="返回">
                <svg class="icon" aria-hidden="true"><use href="#i-back"></use></svg>
            </button>
            <div class="profile-toolbar" id="profileToolbar" hidden>
                <a href="admin.html" class="profile-tool" id="profileAdminLink" data-i18n="admin">后台</a>
                <button type="button" class="profile-tool" id="profileLangBtn">English</button>
                <button type="button" class="profile-tool danger" id="profileLogoutBtn" data-i18n="logout">退出</button>
            </div>

            <section class="profile-hero" id="profileHero">
                <div class="profile-hero-bg" id="profileHeroBg"></div>
                <div class="profile-hero-overlay"></div>
                <div class="profile-hero-content">
                    <div class="profile-avatar" id="profileAvatar">
                        <svg class="icon" aria-hidden="true"><use href="#i-user"></use></svg>
                    </div>
                    <div class="profile-main">
                        <div class="profile-name-row">
                            <h1 class="profile-name" id="profileName"></h1>
                            <button type="button" class="profile-edit-pen" id="profileEditPen" title="修改资料" aria-label="修改资料" data-i18n-title="profileEdit" data-i18n-aria="profileEdit" hidden>
                                <svg class="icon" aria-hidden="true"><use href="#i-pencil"></use></svg>
                            </button>
                        </div>
                        <div class="profile-stats" id="profileStats"></div>
                        <div class="profile-bio" id="profileBio"></div>
                        <div class="profile-hero-actions" id="profileHeroActions"></div>
                    </div>
                </div>
            </section>

            <div class="profile-tabs" id="profileTabs">
                <button type="button" class="profile-tab active" data-ptab="works"><span data-i18n="profileWorks">作品</span> <b id="profileWorksCount">0</b></button>
                <button type="button" class="profile-tab" data-ptab="likes" id="profileLikesTab" hidden><span data-i18n="profileLikes">点赞</span> <b id="profileLikesCount">0</b><svg class="icon profile-private" aria-hidden="true"><use href="#i-lock"></use></svg></button>
                <button type="button" class="profile-tab" data-ptab="bookmarks" id="profileBookmarksTab" hidden><span data-i18n="profileBookmarks">收藏</span> <b id="profileBookmarksCount">0</b><svg class="icon profile-private" aria-hidden="true"><use href="#i-lock"></use></svg></button>
            </div>
            <div class="profile-list-hint" id="profileListHint" hidden></div>
            <div class="profile-works post-grid" id="profileWorks"></div>
        </div>
    </div>

    <!-- 修改个人资料 -->
    <div class="modal-mask" id="profileEditModal" hidden>
        <div class="modal profile-edit-modal">
            <div class="modal-head">
                <span data-i18n="profileEdit">修改资料</span>
                <button type="button" class="modal-close" id="profileEditClose">×</button>
            </div>
            <div class="modal-body">
                <div class="edit-banner" id="editBannerPreview">
                    <label class="edit-upload">
                        <span data-i18n="profileChangeBanner">更换背景</span>
                        <input type="file" id="editBannerFile" accept="image/*" hidden>
                    </label>
                    <button type="button" class="edit-clear" id="editBannerClear" data-i18n="profileRemove">移除</button>
                </div>
                <div class="edit-avatar-row">
                    <div class="edit-avatar" id="editAvatarPreview">
                        <svg class="icon" aria-hidden="true"><use href="#i-user"></use></svg>
                    </div>
                    <div class="edit-avatar-actions">
                        <label class="edit-upload">
                            <span data-i18n="profileChangeAvatar">更换头像</span>
                            <input type="file" id="editAvatarFile" accept="image/*" hidden>
                        </label>
                        <button type="button" class="edit-clear" id="editAvatarClear" data-i18n="profileRemove">移除</button>
                    </div>
                </div>
                <div class="edit-status" id="editStatus"></div>
                <label class="edit-label" for="editDisplayName" data-i18n="profileNickname">昵称</label>
                <input type="text" id="editDisplayName" maxlength="30" class="edit-input">
                <div class="edit-hint" data-i18n="profileRenameHint">修改昵称会同步更新登录名和历史帖子/评论署名</div>
                <label class="edit-label" for="editBio" data-i18n="profileBioLabel">简介</label>
                <textarea id="editBio" maxlength="200" rows="3" class="edit-input" data-i18n-placeholder="profileBioPlaceholder"></textarea>
                <div class="edit-privacy">
                    <div class="edit-privacy-title" data-i18n="profilePrivacyTitle">主页展示</div>
                    <label class="edit-check"><input type="checkbox" id="editLikesPublic"> <span data-i18n="profileLikesPublic">公开我点赞的帖子</span></label>
                    <label class="edit-check"><input type="checkbox" id="editBookmarksPublic"> <span data-i18n="profileBookmarksPublic">公开我收藏的帖子</span></label>
                    <div class="edit-hint" data-i18n="profilePrivacyHint">不公开时只有自己能看到；收藏和点赞会显示在个人主页</div>
                </div>
            </div>
            <div class="edit-footer">
                <button type="button" class="btn" id="profileEditCancel" data-i18n="cancel">取消</button>
                <button type="button" class="btn-post" id="profileEditSave" data-i18n="profileSave">保存</button>
            </div>
        </div>
    </div>

    <!-- 关注/粉丝列表 -->
    <div class="modal-mask" id="connectionsModal" hidden>
        <div class="modal connections-modal">
            <div class="modal-head">
                <span id="connectionsTitle">关注</span>
                <button type="button" class="modal-close" id="connectionsClose">×</button>
            </div>
            <div class="connections-tabs">
                <button type="button" class="connections-tab active" data-type="following" data-i18n="profileFollowing">关注</button>
                <button type="button" class="connections-tab" data-type="followers" data-i18n="profileFollowers">粉丝</button>
            </div>
            <div class="modal-body" id="connectionsList"></div>
        </div>
    </div>

    <!-- 私信弹窗（2.7） -->
    <div class="modal-mask" id="messageModal" hidden>
        <div class="modal message-modal">
            <div class="modal-head">
                <span id="messageTitle" data-i18n="messagesTitle">私信</span>
                <button class="modal-close" id="messageClose">×</button>
            </div>
            <div class="modal-body message-body" id="messageBody"></div>
            <div class="message-compose" id="messageCompose" hidden>
                <input type="text" id="messageInput" maxlength="1000" placeholder="输入私信..." data-i18n-placeholder="msgPlaceholder">
                <button class="btn-post" id="messageSend" data-i18n="send">发送</button>
            </div>
        </div>
    </div>

    <!-- 发帖弹窗 -->
    <div class="modal-mask" id="postModal" hidden>
        <div class="post-dialog">
            <div class="modal-head">
                <span data-i18n="postModalTitle">发布作品</span>
                <button class="modal-close" id="postClose">×</button>
            </div>

            <div class="publish-chooser" id="publishChooser">
                <p class="publish-intro" data-i18n="publishIntro">选择你要发布什么作品</p>
                <div class="publish-grid">
                    <button type="button" class="publish-card" data-publish-board="general">
                        <span class="publish-card-icon general"><svg class="icon"><use href="#i-chat"></use></svg></span>
                        <b data-i18n="boardGeneral">灌水</b>
                        <small data-i18n="publishGeneralDesc">随便聊聊，校园日常</small>
                    </button>
                    <button type="button" class="publish-card" data-publish-board="study">
                        <span class="publish-card-icon study"><svg class="icon"><use href="#i-book"></use></svg></span>
                        <b data-i18n="boardStudy">学习</b>
                        <small data-i18n="publishStudyDesc">笔记、错题、资源、求助</small>
                    </button>
                    <button type="button" class="publish-card" data-publish-board="music">
                        <span class="publish-card-icon music"><svg class="icon"><use href="#i-music"></use></svg></span>
                        <b data-i18n="boardMusic">音乐</b>
                        <small data-i18n="publishMusicDesc">分享一首歌</small>
                    </button>
                    <button type="button" class="publish-card" data-publish-board="poll">
                        <span class="publish-card-icon poll"><svg class="icon"><use href="#i-poll"></use></svg></span>
                        <b data-i18n="boardPoll">投票</b>
                        <small data-i18n="publishPollDesc">让大家选一选</small>
                    </button>
                    <button type="button" class="publish-card" data-publish-board="share">
                        <span class="publish-card-icon share"><svg class="icon"><use href="#i-code"></use></svg></span>
                        <b data-i18n="boardShare">分享</b>
                        <small data-i18n="publishShareDesc">代码、小游戏、教程、其他</small>
                    </button>
                </div>
            </div>

            <div class="publish-form" id="publishForm" hidden>
                <div class="publish-form-top">
                    <button type="button" class="publish-back" id="publishBack">← <span data-i18n="publishBack">重新选择</span></button>
                    <span class="publish-current" id="publishBoardLabel"></span>
                </div>
                <div class="post-body">
                    <div class="board-note" id="publishBoardNote" hidden></div>
                    <div class="post-form-group">
                        <label data-i18n="postAuthorLabel">发布身份</label>
                        <input type="text" id="postAuthor" readonly title="以当前登录账号发布" data-i18n-title="postAuthorTitle">
                    </div>
                    <div class="post-form-group">
                        <label id="postTitleLabel" data-i18n="postTitleLabel">标题</label>
                        <input type="text" id="postTitle" placeholder="给帖子起个标题..." data-i18n-placeholder="postTitlePlaceholder">
                    </div>

                    <div class="music-fields" id="musicFields" hidden>
                        <div class="post-form-group">
                            <label data-i18n="musicArtistLabel">歌手</label>
                            <input type="text" id="musicArtist" maxlength="100" placeholder="歌手名" data-i18n-placeholder="musicArtistPlaceholder">
                        </div>
                        <div class="post-form-group">
                            <label data-i18n="musicUrlLabel">音乐外链</label>
                            <input type="url" id="musicUrl" maxlength="2048" placeholder="https://..." data-i18n-placeholder="musicUrlPlaceholder">
                        </div>
                        <div class="music-hint" data-i18n="musicHint">只保存外部链接，不上传音频文件</div>
                    </div>

                    <div class="post-form-group">
                        <label id="postContentLabel" data-i18n="postContentLabel">正文</label>
                        <div class="md-toolbar" id="mdToolbar" hidden>
                            <button type="button" data-md="bold" title="加粗">B</button>
                            <button type="button" data-md="italic" title="斜体"><i>I</i></button>
                            <button type="button" data-md="heading" title="标题">H</button>
                            <button type="button" data-md="list" title="列表">≡</button>
                            <button type="button" data-md="quote" title="引用">“</button>
                            <button type="button" data-md="code" title="代码块">{ }</button>
                            <button type="button" data-md="link" title="链接">↗</button>
                            <button type="button" data-md="image" title="图片">▧</button>
                        </div>
                        <textarea id="postContent" rows="7" placeholder="想说点什么..." data-i18n-placeholder="postContentPlaceholder"></textarea>
                        <div class="md-preview" id="mdPreview" hidden></div>
                        <div class="md-editor-foot">
                            <span class="md-hint" id="mdHint" hidden data-i18n="mdHint">支持 Markdown：标题、加粗、列表、代码块、图片链接</span>
                            <button type="button" class="md-preview-btn" id="mdPreviewBtn" hidden data-i18n="mdPreview">预览</button>
                        </div>
                    </div>

                    <div class="poll-fields" id="pollFields" hidden>
                        <label class="poll-fields-label" data-i18n="pollOptionsLabel">投票选项</label>
                        <div id="pollOptions"></div>
                        <button type="button" class="poll-add" id="pollAddOption">+ <span data-i18n="pollAddOption">添加选项</span></button>
                        <div class="poll-hint" data-i18n="pollOptionsHint">2–6 个选项，一人一票</div>
                    </div>

                    <div class="post-form-group" id="imageGroup">
                        <label id="imageLabel" data-i18n="postImageLabel">图片（可选，单张 ≤10MB）</label>
                        <div class="upload-area" id="uploadArea">
                            <input type="file" id="postImage" accept="image/*" multiple hidden>
                            <div class="upload-placeholder" id="uploadPlaceholder" data-i18n="postUploadPlaceholder">点击或拖拽上传图片（自动压缩）</div>
                        </div>
                        <div class="upload-hint" id="uploadHint"></div>
                        <div class="image-preview-list" id="imagePreviewList"></div>
                    </div>
                    <div class="post-form-group" id="tagGroup">
                        <label data-i18n="postTagsLabel">标签</label>
                        <div class="tag-picker" id="tagPicker"></div>
                        <div class="tag-new-row">
                            <input type="text" id="newTagInput" placeholder="输入新标签，回车添加" data-i18n-placeholder="postNewTagPlaceholder">
                        </div>
                    </div>
                    <button class="btn-post btn-submit" id="submitPostBtn" data-i18n="postSubmit">发布</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 帖子详情弹窗 -->
    <div class="detail-mask" id="detailModal" hidden>
        <div class="detail-dialog">
            <button class="detail-close" id="detailClose" title="关闭" data-i18n-title="detailClose">✕</button>

            <div class="detail-grid">
                <div class="detail-img-col">
                    <div class="detail-img" id="detailImg"></div>
                    <div class="detail-thumbs" id="detailThumbs" hidden></div>
                    <div class="detail-gallery-nav" id="detailGalleryNav" hidden>
                        <button type="button" id="detailGalleryPrev" aria-label="上一张">‹</button>
                        <span id="detailGalleryCount"></span>
                        <button type="button" id="detailGalleryNext" aria-label="下一张">›</button>
                    </div>
                </div>

                <div class="detail-main-col">
                    <div class="detail-author">
                        <div class="detail-avatar" id="detailAvatar"></div>
                        <div class="detail-author-info">
                            <div class="detail-author-name" id="detailAuthorName"></div>
                            <div class="detail-like" id="detailLikes">♥ 0</div>
                        </div>
                    </div>
                    <h2 class="detail-title" id="detailTitle"></h2>
                    <div class="detail-board" id="detailBoard" hidden></div>
                    <div class="detail-music" id="detailMusic" hidden></div>
                    <div class="detail-tags" id="detailTags" hidden></div>
                    <div class="detail-content" id="detailContent"></div>
                    <div class="detail-poll" id="detailPoll" hidden></div>
                    <div class="detail-time" id="detailTime"></div>
                </div>

                <div class="detail-comments-col">
                    <div class="comments-head">
                        <span><span data-i18n="comments">评论</span> <span id="commentCount">0</span></span>
                        <div class="comments-sort">
                            <button class="sort-btn active" data-sort="earliest" data-i18n="sortEarliest">最早</button>
                            <button class="sort-btn" data-sort="latest" data-i18n="sortLatest">最新</button>
                        </div>
                    </div>
                    <div class="comments-list" id="commentsList"></div>
                </div>
            </div>

            <div class="reply-bar" id="replyBar" hidden>
                <span><span data-i18n="replying">正在回复</span> <b id="replyName"></b></span>
                <button type="button" id="replyCancel" data-i18n="cancel">取消</button>
            </div>

            <div class="detail-footer">
                <div class="mention-box" id="mentionBox" hidden></div>
                <div class="footer-input">
                    <input type="text" id="commentAuthor" readonly title="以当前登录账号评论" data-i18n-title="commentAsTitle" style="width:90px;margin-right:6px;">
                    <input type="text" id="commentInput" placeholder="说点什么..." data-i18n-placeholder="commentPlaceholder">
                </div>
                <button class="footer-btn" id="footerLike" title="点赞（长按三连）" data-i18n-title="like"><svg class="icon icon-heart" aria-hidden="true"><use href="#i-like"></use></svg> <span id="footerLikeCount">0</span><svg class="triple-ring" id="likeRing" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"></circle></svg></button>
                <button class="footer-btn" id="footerCoin" title="硬币" data-i18n-title="coin"><svg class="icon icon-coin" aria-hidden="true"><use href="#i-coin"></use></svg> <span id="footerCoinCount">0</span></button>
                <button class="footer-btn" id="footerStar" title="收藏" data-i18n-title="bookmark"><svg class="icon icon-star" aria-hidden="true"><use href="#i-star"></use></svg> <span id="footerStarCount">0</span></button>
                <button class="footer-btn footer-more" id="footerMore" title="更多" aria-label="更多" aria-haspopup="true" aria-expanded="false" data-i18n-title="more" data-i18n-aria="more">
                    <svg class="icon icon-more" aria-hidden="true"><use href="#i-more"></use></svg>
                </button>
                <div class="more-menu" id="detailMoreMenu" hidden>
                    <button type="button" class="more-item danger" id="moreDelete" data-i18n="delete">删除</button>
                    <button type="button" class="more-item" id="moreReport" data-i18n="report">举报</button>
                </div>
            </div>
        </div>
    </div>

    <div class="triple-toast" id="tripleToast" hidden></div>

    <!-- 投币数量选择 -->
    <div class="coin-mask" id="coinModal" hidden>
        <div class="coin-dialog" role="dialog" aria-modal="true">
            <div class="coin-dialog-head">
                <span data-i18n="coinModalTitle">投币</span>
                <button type="button" class="coin-close" id="coinClose" data-i18n-aria="detailClose">×</button>
            </div>
            <p class="coin-choose" data-i18n="coinChoose">选择投币数量</p>
            <div class="coin-options">
                <button type="button" class="coin-option" data-amount="1">
                    <svg class="icon icon-coin" aria-hidden="true"><use href="#i-coin"></use></svg>
                    <span data-i18n="coinOne">1 币</span>
                </button>
                <button type="button" class="coin-option" data-amount="2">
                    <svg class="icon icon-coin" aria-hidden="true"><use href="#i-coin"></use></svg>
                    <span data-i18n="coinTwo">2 币</span>
                </button>
            </div>
            <button type="button" class="coin-cancel" id="coinCancel" data-i18n="cancel">取消</button>
        </div>
    </div>

    <!-- 图片查看器（点击详情图放大 / 轮播 / 下载） -->
    <div class="detail-mask image-viewer" id="imageViewer" hidden>
        <button type="button" class="detail-close" id="imageViewerClose" title="关闭" data-i18n-title="detailClose">✕</button>
        <button type="button" class="image-viewer-nav prev" id="imageViewerPrev" title="上一张" data-i18n-title="prevImage">‹</button>
        <img class="image-viewer-img" id="imageViewerImg" alt="帖子图片" data-i18n-aria="imageAlt">
        <button type="button" class="image-viewer-nav next" id="imageViewerNext" title="下一张" data-i18n-title="nextImage">›</button>
        <div class="image-viewer-count" id="imageViewerCount"></div>
        <a class="image-viewer-download" id="imageViewerDownload" data-i18n="downloadImage">下载图片</a>
    </div>

    <!-- 站内刷新（不调用浏览器刷新） -->
    <button type="button" class="refresh-float-btn" id="refreshBtn" title="刷新帖子" aria-label="刷新帖子" data-i18n-title="refreshTitle" data-i18n-aria="refreshTitle">
        <svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
    </button>

    <!-- AI 聊天窗口 - 耀耀 -->
    <button class="chat-float-btn" id="chatToggleBtn" title="和耀耀聊天" data-i18n-title="chatOpen">
        <img src="mascot.png" alt="耀耀">
    </button>
    <div class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="chat-avatar"><img src="mascot.png" alt="耀耀"></div>
                <span data-i18n="chatTitle">耀耀</span>
            </div>
            <button class="chat-close-btn" onclick="closeChat()">×</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg ai"><div class="bubble" data-i18n="chatWelcome">你好！我是耀耀，有什么可以帮你的？</div></div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="输入消息..." data-i18n-placeholder="chatPlaceholder">
            <button id="chatSendBtn" data-i18n="chatSend">发送</button>
        </div>
    </div>

    <script src="js/auth.js?v=20261124d"></script>
    <script src="js/i18n.js?v=20261124d"></script>
    <script src="js/chat.js?v=20261124d"></script>
    <script src="js/script.js?v=20261124d"></script>
</body>
</html>
