<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子详情 - YWIES 论坛</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 顶部导航 -->
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <img src="school-badge.png" class="brand-logo" alt="校徽">
                <span class="brand-name">YWIES 论坛</span>
            </div>
            <div class="topbar-actions">
                <a href="index.html" class="btn">返回首页</a>
            </div>
        </div>
    </header>

    <!-- 帖子详情 -->
    <main style="max-width:720px;margin:0 auto;padding:20px;">
        <div class="detail-card">
            <h2 id="detail-title">加载中...</h2>
            <div class="detail-meta" id="detail-meta"></div>
            <div class="detail-content" id="detail-content">内容加载中...</div>
        </div>
    </main>

    <!-- AI聊天窗口 - 耀耀 -->
    <button class="chat-float-btn" id="chatToggleBtn" title="和耀耀聊天">
        <img src="mascot.png" alt="耀耀">
    </button>
    <div class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="chat-avatar"><img src="mascot.png" alt="耀耀"></div>
                <span>耀耀</span>
            </div>
            <button class="chat-close-btn" onclick="closeChat()">×</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg ai"><div class="bubble">你好！我是耀耀，有什么可以帮你的？</div></div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="输入消息...">
            <button id="chatSendBtn">发送</button>
        </div>
    </div>

    <script src="js/language.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/detail.js"></script>
</body>
</html>
