<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发帖 - YWIES 论坛</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 顶部导航 -->
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <img src="school-badge.png" class="brand-logo" alt="校徽">
                <span class="brand-name">YWIES 论坛</span>
            </div>
            <div class="topbar-actions">
                <a href="index.html" class="btn">返回首页</a>
            </div>
        </div>
    </header>

    <!-- 发帖表单 -->
    <main class="container" style="max-width:720px;margin:0 auto;padding:20px;">
        <div class="form-panel">
            <h2 style="margin-bottom: 20px; color:#fff; font-size:20px;">发布新帖子</h2>

            <div class="form-group">
                <label>标题</label>
                <input type="text" id="postTitle" placeholder="给帖子起个标题...">
            </div>

            <div class="form-group">
                <label>标签</label>
                <select id="postTag" style="width:100%;padding:10px 12px;background:#0d0d0f;border:1px solid #26262c;border-radius:8px;color:#fff;font-size:14px;">
                    <option value="">不选</option>
                    <option value="食堂">食堂</option>
                    <option value="社团招新">社团招新</option>
                    <option value="物品交换">物品交换</option>
                    <option value="求助">求助</option>
                    <option value="闲聊">闲聊</option>
                </select>
            </div>

            <div class="form-group">
                <label>内容</label>
                <textarea id="postContent" placeholder="想说点什么..."></textarea>
            </div>

            <button class="btn-post" style="width: 100%; padding: 12px; font-size: 16px; border:none; cursor:pointer;" onclick="submitPost()">
                发布帖子
            </button>
        </div>
    </main>

    <!-- AI聊天窗口 - 耀耀 -->
    <button class="chat-float-btn" id="chatToggleBtn" title="和耀耀聊天">
        <img src="mascot.png" alt="耀耀">
    </button>
    <div class="chat-panel" id="chatPanel">
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="chat-avatar"><img src="mascot.png" alt="耀耀"></div>
                <span>耀耀</span>
            </div>
            <button class="chat-close-btn" onclick="closeChat()">×</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg ai"><div class="bubble">你好！我是耀耀，有什么可以帮你的？</div></div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="输入消息...">
            <button id="chatSendBtn">发送</button>
        </div>
    </div>

    <script src="js/language.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/post.js"></script>
</body>
</html>
