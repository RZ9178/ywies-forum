<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - YWIES 论坛</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@5.0.0/lib/Normal/MiSansVF.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css?v=20261119y">
    <link rel="stylesheet" href="admin.css?v=20261119y">
</head>
<body class="admin-body">
    <svg style="display:none" aria-hidden="true">
        <symbol id="adm-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
        <symbol id="adm-post" viewBox="0 0 24 24"><path d="M6 4h9l3 3v13H6z"/><path d="M9 10h6M9 14h6M9 18h4"/></symbol>
        <symbol id="adm-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c.6-3.4 2.7-5 6-5s5.4 1.6 6 5"/><circle cx="17" cy="9" r="2.2"/><path d="M16 15.5c2.6.2 4.2 1.6 4.7 4.5"/></symbol>
        <symbol id="adm-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.4-2.7 7.7-7 9-4.3-1.3-7-4.6-7-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
        <symbol id="adm-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></symbol>
        <symbol id="adm-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.7"/><path d="M20 4v7h-7"/></symbol>
        <symbol id="adm-out" viewBox="0 0 24 24"><path d="M10 5H5v14h5"/><path d="M14 8l4 4-4 4"/><path d="M8 12h10"/></symbol>
        <symbol id="adm-home" viewBox="0 0 24 24"><path d="m4 11 8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-6h4v6"/></symbol>
        <symbol id="adm-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
        <symbol id="adm-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/><path d="M10 11v5M14 11v5"/></symbol>
        <symbol id="adm-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 7l2 2M18 5l2 2"/></symbol>
        <symbol id="adm-crown" viewBox="0 0 24 24"><path d="m4 8 4 4 4-7 4 7 4-4-2 11H6z"/></symbol>
    </svg>

    <div class="admin-shell">
        <aside class="admin-sidebar">
            <a class="admin-brand" href="index.html">
                <img src="school-badge.png" alt="校徽">
                <span class="admin-brand-text"><strong>YWIES Forum</strong><span>管理后台</span></span>
            </a>
            <nav class="admin-nav" aria-label="后台导航">
                <button type="button" class="admin-nav-item active" data-view="overview">
                    <svg class="admin-ico"><use href="#adm-grid"></use></svg>概览
                </button>
                <button type="button" class="admin-nav-item" data-view="posts">
                    <svg class="admin-ico"><use href="#adm-post"></use></svg>帖子管理
                    <span class="admin-nav-count" id="adminNavPosts">0</span>
                </button>
                <button type="button" class="admin-nav-item" data-view="users">
                    <svg class="admin-ico"><use href="#adm-users"></use></svg>用户管理
                    <span class="admin-nav-count" id="adminNavUsers">0</span>
                </button>
                <button type="button" class="admin-nav-item" data-view="audit">
                    <svg class="admin-ico"><use href="#adm-shield"></use></svg>内容审查
                </button>
            </nav>
            <div class="admin-sidebar-foot">
                <a class="admin-side-link" href="index.html"><svg class="admin-ico"><use href="#adm-home"></use></svg>返回论坛</a>
                <button type="button" class="admin-side-link" id="adminLogout"><svg class="admin-ico"><use href="#adm-out"></use></svg>退出登录</button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div>
                    <h1 id="adminTitle">概览</h1>
                    <p id="adminSubtitle">论坛运营数据与最近动态</p>
                </div>
                <div class="admin-header-right">
                    <span class="admin-who" id="adminWho"></span>
                    <button type="button" class="admin-icon-btn" id="adminRefresh" title="刷新" aria-label="刷新">
                        <svg class="admin-ico"><use href="#adm-refresh"></use></svg>
                    </button>
                </div>
            </header>

            <div class="admin-toast" id="adminToast" hidden></div>

            <section class="admin-view" data-view="overview">
                <div class="admin-stat-grid">
                    <article class="admin-stat">
                        <span class="admin-stat-icon"><svg class="admin-ico"><use href="#adm-users"></use></svg></span>
                        <div><div class="admin-stat-num" id="adminStatUsers">-</div><div class="admin-stat-label">注册用户</div></div>
                    </article>
                    <article class="admin-stat">
                        <span class="admin-stat-icon green"><svg class="admin-ico"><use href="#adm-post"></use></svg></span>
                        <div><div class="admin-stat-num" id="adminStatPosts">-</div><div class="admin-stat-label">帖子总数</div></div>
                    </article>
                    <article class="admin-stat">
                        <span class="admin-stat-icon orange"><svg class="admin-ico"><use href="#adm-post"></use></svg></span>
                        <div><div class="admin-stat-num" id="adminStatComments">-</div><div class="admin-stat-label">评论总数</div></div>
                    </article>
                    <article class="admin-stat">
                        <span class="admin-stat-icon violet"><svg class="admin-ico"><use href="#adm-crown"></use></svg></span>
                        <div><div class="admin-stat-num" id="adminStatAdmins">-</div><div class="admin-stat-label">管理员</div></div>
                    </article>
                    <article class="admin-stat">
                        <span class="admin-stat-icon rose"><svg class="admin-ico"><use href="#adm-key"></use></svg></span>
                        <div><div class="admin-stat-num" id="adminStatCoins">-</div><div class="admin-stat-label">硬币总量</div></div>
                    </article>
                </div>

                <div class="admin-split">
                    <section class="admin-card">
                        <div class="admin-card-head"><h2>最近帖子</h2><button type="button" class="admin-link-btn" data-view="posts">查看全部</button></div>
                        <div class="admin-mini-list" id="adminRecentPosts"><div class="admin-loading">加载中...</div></div>
                    </section>
                    <section class="admin-card">
                        <div class="admin-card-head"><h2>最近用户</h2><button type="button" class="admin-link-btn" data-view="users">查看全部</button></div>
                        <div class="admin-mini-list" id="adminRecentUsers"><div class="admin-loading">加载中...</div></div>
                    </section>
                </div>
            </section>

            <section class="admin-view" data-view="posts" hidden>
                <section class="admin-card">
                    <div class="admin-toolbar">
                        <label class="admin-search">
                            <svg><use href="#adm-search"></use></svg>
                            <input type="text" id="adminPostSearch" placeholder="搜索标题、正文或作者...">
                        </label>
                        <div class="admin-segmented" id="adminPostFilter">
                            <button type="button" data-filter="all" class="active">全部</button>
                            <button type="button" data-filter="image">有图</button>
                            <button type="button" data-filter="text">纯文字</button>
                        </div>
                        <span class="admin-count" id="adminPostCount"></span>
                    </div>
                    <div class="admin-list" id="adminPostList"><div class="admin-loading">加载中...</div></div>
                    <div class="admin-pager">
                        <button type="button" class="admin-btn sm" id="adminPostPrev">上一页</button>
                        <span id="adminPostPage">-</span>
                        <button type="button" class="admin-btn sm" id="adminPostNext">下一页</button>
                    </div>
                </section>
            </section>

            <section class="admin-view" data-view="users" hidden>
                <section class="admin-card">
                    <div class="admin-toolbar">
                        <label class="admin-search">
                            <svg><use href="#adm-search"></use></svg>
                            <input type="text" id="adminUserSearch" placeholder="搜索昵称、用户名或邮箱...">
                        </label>
                        <div class="admin-segmented" id="adminUserFilter">
                            <button type="button" data-filter="all" class="active">全部</button>
                            <button type="button" data-filter="admin">管理员</button>
                            <button type="button" data-filter="normal">普通用户</button>
                        </div>
                        <span class="admin-count" id="adminUserCount"></span>
                    </div>
                    <div class="admin-list" id="adminUserList"><div class="admin-loading">加载中...</div></div>
                    <div class="admin-pager">
                        <button type="button" class="admin-btn sm" id="adminUserPrev">上一页</button>
                        <span id="adminUserPage">-</span>
                        <button type="button" class="admin-btn sm" id="adminUserNext">下一页</button>
                    </div>
                </section>
            </section>

            <section class="admin-view" data-view="audit" hidden>
                <section class="admin-card">
                    <div class="admin-tabs" id="adminAuditTabs">
                        <button type="button" class="admin-tab active" data-audit="comments">最近评论</button>
                        <button type="button" class="admin-tab" data-audit="posts">最近帖子</button>
                        <button type="button" class="admin-tab" data-audit="deletions">删除记录</button>
                    </div>
                    <div id="adminAuditList"><div class="admin-loading">加载中...</div></div>
                </section>
            </section>
        </main>
    </div>

    <div class="admin-modal-mask" id="adminDetailMask" hidden>
        <div class="admin-modal">
            <div class="admin-modal-head">
                <h2 id="adminDetailTitle">详情</h2>
                <button type="button" class="admin-modal-close" id="adminDetailClose" aria-label="关闭">×</button>
            </div>
            <div class="admin-modal-body" id="adminDetailBody"></div>
            <div class="admin-modal-foot" id="adminDetailFoot" hidden></div>
        </div>
    </div>

    <div class="admin-modal-mask" id="adminConfirmMask" hidden>
        <div class="admin-modal small">
            <div class="admin-modal-head">
                <h2 id="adminConfirmTitle">确认操作</h2>
                <button type="button" class="admin-modal-close" id="adminConfirmClose" aria-label="关闭">×</button>
            </div>
            <div class="admin-modal-body"><p class="admin-confirm-text" id="adminConfirmText"></p></div>
            <div class="admin-modal-foot">
                <button type="button" class="admin-btn" id="adminConfirmNo">取消</button>
                <button type="button" class="admin-btn danger" id="adminConfirmYes">确认</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js?v=20261119y"></script>
    <script src="js/admin.js?v=20261119y"></script>
</body>
</html>
